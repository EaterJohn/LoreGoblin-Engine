[project]
name = "loregoblin-engine"
version = "0.1.0"
description = "Local-first engine for persistent LLM-driven worlds."
readme = "README.md"
# Проверено на 3.12; код не использует ничего специфичного для 3.14.
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

# Плоская раскладка: без явного списка setuptools не может выбрать пакеты
# (в корне лежат ещё data/ и docs/), и `pip install -e .` падает.
[tool.setuptools]
packages = ["engine", "llm"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
